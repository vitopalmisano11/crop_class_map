[project]
name = "crop_class_map"
version = "0.1.0"
description = "Streamlit app to map ARPAE iColt agricultural crop parcels around a point in Emilia-Romagna."
authors = [
    { name = "Luca Di Cecilia", email = "luca.dicecilia@leitha.eu" }
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "streamlit>=1.58.0",
    "streamlit-folium>=0.27.2",
    "geopandas>=1.1.1",
    "folium>=0.20.0",
    "shapely>=2.1.2",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

